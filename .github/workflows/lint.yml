name: lint

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ '*' ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ruff:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up python
      uses: actions/setup-python@v5
      with:
        python-version: "3.13"
    - name: Install uv
      uses: astral-sh/setup-uv@v5
    # Run the ruff pinned in uv.lock rather than `uvx ruff`/a fresh resolve, so
    # a ruff release that enables new rules by default (as 0.16 did, going from
    # 59 to 413) lands as a deliberate lockfile bump instead of breaking every
    # open PR's lint job.
    - name: Install dependencies
      run: uv sync --extra dev
    - name: Lint with ruff
      run: uv run ruff check . --statistics
