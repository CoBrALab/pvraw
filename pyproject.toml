[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[project]
classifiers = [
    'Development Status :: 5 - Production/Stable',
    'Intended Audience :: Science/Research',
    'Topic :: Scientific/Engineering :: Medical Science Apps.',
    'Natural Language :: English',
]
dependencies = [
    'brukerapi>=0.4.4',
    'pyyaml>=6.0.1',
    'numpy>=1.23.2',
    'xnippet>=0.1.1',
    'reshipe>=0.1.0',
    'nibabel>=3.2.1',
    'pandas>=1.5.0',
    # >=1.2 for `schema.bids_version` and the `rules.sidecars` layout the BIDS
    # conformance work reads; 0.7 predates both.
    'bidsschematools>=1.2',
]
description = "Bruker PvDataset Loader (maintained fork of the BrkRaw 0.3.x/0.4 line)"
license = {text = "GPL-3.0-or-later"}
dynamic = ["version"]
authors = [
    {name = "SungHo Lee", email = 'shlee@unc.edu'},
    {name = "Woomi Ban", email = 'banwoomi@unc.edu'},
    {name = "Jaiden Dumas"},
    {name = "Gabriel A. Devenyi", email = 'gdevenyi@gmail.com'},
    {name = "Yen-Yu Ian Shih", email = 'shihy@neurology.unc.edu'},
]
maintainers = [
    {name = "Gabriel A. Devenyi", email = 'gdevenyi@gmail.com'}
]
name = "brkraw-legacy"
readme = "README.md"
requires-python = ">=3.11"
keywords = [
    'bruker',
    'data_handler',
    'converter',
    'administrator_tool',
    'extensible',
]

[project.urls]
Homepage = "https://github.com/gdevenyi/brkraw-legacy"
Repository = "https://github.com/gdevenyi/brkraw-legacy"
Issues = "https://github.com/gdevenyi/brkraw-legacy/issues"

[project.optional-dependencies]
dev = [
    "ruff>=0.16.0",
    "pytest",
    "nbmake",
    "types-PyYAML",
    "bids-validator-deno",
]

[tool.hatch.version]
path = "brkraw_legacy/__init__.py"
style = "pep440"

[tool.hatch.build.targets.wheel]
packages = ["brkraw_legacy"]

[project.scripts]
brkraw-legacy = "brkraw_legacy.scripts.brkraw_legacy:main"

[tool.pytest.ini_options]
log_cli = true
log_cli_level = "DEBUG"
testpaths = ["tests"]
markers = [
    "data: needs sample data fetched from the network",
]

[tool.ruff]
target-version = "py311"

[tool.ruff.format]
# The codebase quotes with '...'; this is what ruff's autofixes generate with.
quote-style = "single"

[tool.ruff.lint]
# Ruff's default rule set is the baseline. Listed below are the rules this
# project deliberately does not follow -- everything else is expected to pass,
# so a new violation is a real finding rather than noise.
ignore = [
    # Converting a study must not abort because one scan of it fails. The
    # per-scan conversion loops, the optional-parameter fallbacks and the
    # sweep harnesses under tools/ all catch broadly on purpose; each one
    # warns, falls back to a documented default, or re-raises a typed error.
    "BLE001",
]

[tool.ruff.lint.per-file-ignores]
# Test modules are named for the layer they cover (02_api_analyzer,
# 04_api_data, ...) so the suite reads in dependency order; the leading digits
# are the documented convention, not an invalid module name.
# S112 flags the scan-and-skip loops that hunt for a convertible scan, which
# is what those tests are for.
"tests/*" = ["N999", "S112"]
